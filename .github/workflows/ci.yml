name: dotOrcA CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  pure-rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: cargo test --locked
      - run: cargo check --locked
      - if: runner.os == 'Linux'
        run: cargo test --locked -p orca-gui
  gui:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: crates/gui
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build CUI static libraries
        shell: pwsh
        run: |
          cmake -S . -B build -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build Rust integration
        shell: pwsh
        run: |
          rustc -Vv
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          $env:CUI_LIB_DIR = (Resolve-Path build/lib).Path
          cargo build --release --locked --target x86_64-pc-windows-msvc -p orca-gui
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --release --locked --target x86_64-pc-windows-msvc -p orca-gui
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force ../../dist | Out-Null
          $exe = '../../target/x86_64-pc-windows-msvc/release/dotorca.exe'
          $process = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList '--self-test' -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Native drop self-test timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Native drop self-test failed ($($process.ExitCode))" }
          Copy-Item $exe ../../dist/
          cargo build --release --locked --target x86_64-pc-windows-msvc -p orca-core --bin orca-verify
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item ../../target/x86_64-pc-windows-msvc/release/orca-verify.exe ../../dist/
          Copy-Item ../../Cargo.lock ../../dist/
          Copy-Item ../../README.md ../../dist/
          Copy-Item ../../LICENSE ../../dist/
          git rev-parse HEAD | Out-File ../../dist/source-sha.txt -Encoding ascii
          $metadata = cargo metadata --locked --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = ($metadata.packages | Where-Object name -eq 'orca-gui').version
          $version | Out-File ../../dist/version.txt -Encoding ascii
          (Get-Item $exe).Length | Out-File ../../dist/size-bytes.txt
          Get-FileHash $exe -Algorithm SHA256 | Format-List | Out-File ../../dist/sha256.txt
          rustc -Vv | Out-File ../../dist/rustc.txt
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $dumpbin) { throw 'dumpbin not found' }
          & $dumpbin.FullName /dependents $exe | Out-File ../../dist/pe-imports.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $upstream = 'build/_deps/cui-src'
          git -C $upstream rev-parse HEAD | Out-File ../../dist/cui-source.txt
          New-Item -ItemType Directory -Force ../../dist/licenses | Out-Null
          Copy-Item ICON-ATTRIBUTION.md ../../dist/licenses/
          Copy-Item LICENSE-TWEMOJI-GRAPHICS.txt ../../dist/licenses/
          foreach ($f in @('LICENSE', 'THIRD_PARTY.md', 'assets/fonts/LICENSE-Inter.txt', 'assets/fonts/LICENSE-Geist.txt', 'assets/fonts/LICENSE-Lucide.txt', 'third_party/LICENSE-Unicode.txt')) {
            Copy-Item (Join-Path $upstream $f) ../../dist/licenses/
          }
          # Preserve license texts for the statically linked Rust dependencies.
          foreach ($pkg in $metadata.packages | Where-Object { $_.source -like 'registry+*' }) {
            $licenseDir = Join-Path ../../dist/licenses ("{0}-{1}" -f $pkg.name, $pkg.version)
            $texts = @(Get-ChildItem -LiteralPath (Split-Path $pkg.manifest_path) -File | Where-Object { $_.Name -match '^(LICENSE|LICENCE|COPYING|NOTICE|UNLICENSE)' })
            if ($texts.Count -eq 0) { throw "Missing license text for $($pkg.name)" }
            New-Item -ItemType Directory -Force $licenseDir | Out-Null
            $texts | Copy-Item -Destination $licenseDir
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotOrcA-windows-x64
          path: dist/
          if-no-files-found: error

  core:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build and process self-test
        shell: pwsh
        run: |
          if ($IsWindows) { $env:RUSTFLAGS = '-C target-feature=+crt-static' }
          cargo build --locked --release -p orca-core --bin dotorca-s01
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = if ($IsWindows) { './target/release/dotorca-s01.exe' } else { './target/release/dotorca-s01' }
          & $exe --self-test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Real Windows media fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --version=9.1.0 -y --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $env:PATH += ";C:\ProgramData\chocolatey\bin"
          }
          $ffmpeg = (Get-Command ffmpeg -CommandType Application).Source
          $ffprobe = (Get-Command ffprobe -CommandType Application).Source
          & ./target/release/dotorca-s01.exe --ci-media --ffmpeg $ffmpeg --ffprobe $ffprobe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./target/release/dotorca-s01.exe --ffmpeg $ffmpeg --ffprobe $ffprobe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Windows artifact
        if: runner.os == 'Windows' && (success() || failure())
        shell: pwsh
        run: |
          if (-not (Test-Path target/release/dotorca-s01.exe)) { throw 'No compiled EXE' }
          New-Item -ItemType Directory -Force dist-s01 | Out-Null
          Copy-Item target/release/dotorca-s01.exe dist-s01/
          Copy-Item Cargo.lock dist-s01/
          git rev-parse HEAD | Out-File dist-s01/source-sha.txt
          rustc -Vv | Out-File dist-s01/rustc.txt
          Get-FileHash dist-s01/dotorca-s01.exe -Algorithm SHA256 | Format-List | Out-File dist-s01/sha256.txt
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $dumpbin) { throw 'dumpbin not found' }
          & $dumpbin.FullName /dependents dist-s01/dotorca-s01.exe | Out-File dist-s01/pe-imports.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Windows' && (success() || failure())
        with:
          name: dotOrcA-S01
          path: dist-s01/
          if-no-files-found: error

  pipeline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run actual encoding and transactional validation
        shell: pwsh
        run: |
          if ($IsWindows) {
            choco install ffmpeg-full --version=9.1.0 -y --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $package = Join-Path $env:ChocolateyInstall 'lib\ffmpeg-full\tools'
            $bin = (Get-ChildItem -LiteralPath $package -Recurse -File -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
            if (-not $bin) { throw 'FFmpeg full executable missing' }
            $env:DOTORCA_TEST_FFMPEG = Join-Path $bin 'ffmpeg.exe'
            $env:DOTORCA_TEST_FFPROBE = Join-Path $bin 'ffprobe.exe'
            $env:RUSTFLAGS = '-C target-feature=+crt-static'
          } else {
            if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
              sudo apt-get update
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
              sudo apt-get install -y ffmpeg
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
            }
            $env:DOTORCA_TEST_FFMPEG = (Get-Command ffmpeg -CommandType Application | Select-Object -First 1).Source
            $env:DOTORCA_TEST_FFPROBE = (Get-Command ffprobe -CommandType Application | Select-Object -First 1).Source
          }
          if ($IsWindows) {
            $vhd = Join-Path $env:RUNNER_TEMP 'dotorca-full-test.vhd'
            $script = Join-Path $env:RUNNER_TEMP 'dotorca-vhd.txt'
            try {
              @(
                "create vdisk file=`"$vhd`" maximum=32 type=fixed"
                "select vdisk file=`"$vhd`""
                'attach vdisk'
                'create partition primary'
                'format fs=ntfs quick label=DotOrcAFill'
                'assign'
              ) | Set-Content -LiteralPath $script -Encoding ascii
              & diskpart.exe /s $script
              if ($LASTEXITCODE) { throw "DiskPart setup failed ($LASTEXITCODE)" }
              $volume = Get-Volume -FileSystemLabel 'DotOrcAFill'
              if (-not $volume.DriveLetter) { throw 'Test volume has no drive letter' }
              $testRoot = Join-Path "$($volume.DriveLetter):\" 'dotOrcA-test'
              New-Item -ItemType Directory -Path $testRoot -ErrorAction Stop | Out-Null
              $env:DOTORCA_TEST_FULL_ROOT = $testRoot
              cargo test --locked -p orca-core production_special_path -- --ignored --nocapture
              if ($LASTEXITCODE) { throw "Pipeline regression failed ($LASTEXITCODE)" }
            } finally {
              if (Test-Path -LiteralPath $vhd) {
                @("select vdisk file=`"$vhd`"", 'detach vdisk') |
                  Set-Content -LiteralPath $script -Encoding ascii
                & diskpart.exe /s $script
                if ($LASTEXITCODE) { throw "DiskPart detach failed ($LASTEXITCODE)" }
                Remove-Item -LiteralPath $vhd -ErrorAction Stop
              }
              Remove-Item -LiteralPath $script -ErrorAction SilentlyContinue
            }
          } else {
            cargo test --locked -p orca-core production_special_path -- --ignored --nocapture
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v')
    needs: [pure-rust, gui, core, pipeline]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Publish verified Windows package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --name dotOrcA-windows-x64 --dir dist
          version="$(tr -d '\r\n' < dist/version.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          test "$(tr -d '\r\n' < dist/source-sha.txt)" = "$GITHUB_SHA"
          test "$(git log -1 --format=%s)" = "Release $tag"
          test -s dist/dotorca.exe
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing overwrite" >&2
            exit 1
          fi
          if [[ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]]; then
            echo "Tag $tag already exists; refusing overwrite" >&2
            exit 1
          fi
          # The validation CLI is a CI tool, not required for the portable app.
          rm -f dist/orca-verify.exe
          asset="dotOrcA-$tag-win-x64.zip"
          (cd dist && zip -q -r "../$asset" .)
          sha256sum "$asset" > "$asset.sha256"
          gh release create "$tag" "$asset" "$asset.sha256" --target "$GITHUB_SHA" --title "dotOrcA $tag" --notes-file docs/RELEASE-NOTES.md
