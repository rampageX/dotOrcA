name: dotOrcA CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  pure-rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: cargo test --locked
      - run: cargo check --locked
      - if: runner.os == 'Linux'
        run: cargo test --locked -p orca-gui
  gui:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: crates/gui
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build CUI static libraries
        shell: pwsh
        run: |
          cmake -S . -B build -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build Rust integration
        shell: pwsh
        run: |
          rustc -Vv
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          $env:CUI_LIB_DIR = (Resolve-Path build/lib).Path
          cargo build --release --locked --target x86_64-pc-windows-msvc -p orca-gui
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --release --locked --target x86_64-pc-windows-msvc -p orca-gui
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force ../../dist | Out-Null
          $exe = '../../target/x86_64-pc-windows-msvc/release/dotorca.exe'
          $process = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList '--self-test' -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Native drop self-test timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Native drop self-test failed ($($process.ExitCode))" }
          Copy-Item $exe ../../dist/
          cargo build --release --locked --target x86_64-pc-windows-msvc -p orca-core --bin orca-verify
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item ../../target/x86_64-pc-windows-msvc/release/orca-verify.exe ../../dist/
          Copy-Item ../../Cargo.lock ../../dist/
          Copy-Item ../../README.md ../../dist/
          git rev-parse HEAD | Out-File ../../dist/source-sha.txt -Encoding ascii
          $metadata = cargo metadata --locked --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = ($metadata.packages | Where-Object name -eq 'orca-gui').version
          $version | Out-File ../../dist/version.txt -Encoding ascii
          (Get-Item $exe).Length | Out-File ../../dist/size-bytes.txt
          Get-FileHash $exe -Algorithm SHA256 | Format-List | Out-File ../../dist/sha256.txt
          rustc -Vv | Out-File ../../dist/rustc.txt
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $dumpbin) { throw 'dumpbin not found' }
          & $dumpbin.FullName /dependents $exe | Out-File ../../dist/pe-imports.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $upstream = 'build/_deps/cui-src'
          git -C $upstream rev-parse HEAD | Out-File ../../dist/cui-source.txt
          New-Item -ItemType Directory -Force ../../dist/licenses | Out-Null
          Copy-Item ICON-ATTRIBUTION.md ../../dist/licenses/
          Copy-Item LICENSE-TWEMOJI-GRAPHICS.txt ../../dist/licenses/
          foreach ($f in @('LICENSE', 'THIRD_PARTY.md', 'assets/fonts/LICENSE-Inter.txt', 'assets/fonts/LICENSE-Geist.txt', 'assets/fonts/LICENSE-Lucide.txt', 'third_party/LICENSE-Unicode.txt')) {
            Copy-Item (Join-Path $upstream $f) ../../dist/licenses/
          }
          # Preserve license texts for the statically linked Rust dependencies.
          foreach ($pkg in $metadata.packages | Where-Object { $_.source -like 'registry+*' }) {
            $licenseDir = Join-Path ../../dist/licenses ("{0}-{1}" -f $pkg.name, $pkg.version)
            $texts = @(Get-ChildItem -LiteralPath (Split-Path $pkg.manifest_path) -File | Where-Object { $_.Name -match '^(LICENSE|LICENCE|COPYING|NOTICE|UNLICENSE)' })
            if ($texts.Count -eq 0) { throw "Missing license text for $($pkg.name)" }
            New-Item -ItemType Directory -Force $licenseDir | Out-Null
            $texts | Copy-Item -Destination $licenseDir
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotOrcA-windows-x64
          path: dist/
          if-no-files-found: error

  core:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build and process self-test
        shell: pwsh
        run: |
          if ($IsWindows) { $env:RUSTFLAGS = '-C target-feature=+crt-static' }
          cargo build --locked --release -p orca-core --bin dotorca-s01
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = if ($IsWindows) { './target/release/dotorca-s01.exe' } else { './target/release/dotorca-s01' }
          & $exe --self-test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Real Windows media fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --version=9.1.0 -y --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $env:PATH += ";C:\ProgramData\chocolatey\bin"
          }
          $ffmpeg = (Get-Command ffmpeg -CommandType Application).Source
          $ffprobe = (Get-Command ffprobe -CommandType Application).Source
          & ./target/release/dotorca-s01.exe --ci-media --ffmpeg $ffmpeg --ffprobe $ffprobe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./target/release/dotorca-s01.exe --ffmpeg $ffmpeg --ffprobe $ffprobe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Windows artifact
        if: runner.os == 'Windows' && (success() || failure())
        shell: pwsh
        run: |
          if (-not (Test-Path target/release/dotorca-s01.exe)) { throw 'No compiled EXE' }
          New-Item -ItemType Directory -Force dist-s01 | Out-Null
          Copy-Item target/release/dotorca-s01.exe dist-s01/
          Copy-Item Cargo.lock dist-s01/
          git rev-parse HEAD | Out-File dist-s01/source-sha.txt
          rustc -Vv | Out-File dist-s01/rustc.txt
          Get-FileHash dist-s01/dotorca-s01.exe -Algorithm SHA256 | Format-List | Out-File dist-s01/sha256.txt
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $dumpbin) { throw 'dumpbin not found' }
          & $dumpbin.FullName /dependents dist-s01/dotorca-s01.exe | Out-File dist-s01/pe-imports.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Windows' && (success() || failure())
        with:
          name: dotOrcA-S01
          path: dist-s01/
          if-no-files-found: error

  benchmark:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build standalone CLI
        shell: pwsh
        run: |
          if ($IsWindows) { $env:RUSTFLAGS = '-C target-feature=+crt-static' }
          $env:DOTORCA_SOURCE_SHA = git rev-parse HEAD
          cargo build --locked --release -p orca-benchmark
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install FFmpeg if needed
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            if ($IsWindows) {
              choco install ffmpeg --version=9.1.0 -y --no-progress
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
              'C:\ProgramData\chocolatey\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
            } else {
              sudo apt-get update
              sudo apt-get install -y ffmpeg
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
            }
          }
      - name: Smoke measurement
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { './target/release/orca-benchmark.exe' } else { './target/release/orca-benchmark' }
          $ffmpeg = (Get-Command ffmpeg -CommandType Application | Select-Object -First 1).Source
          $ffprobe = (Get-Command ffprobe -CommandType Application | Select-Object -First 1).Source
          $root = Join-Path (Get-Location) 'S02 小K & (黑洞) ^ % !'
          & $exe --smoke --repeats 1 --ffmpeg $ffmpeg --ffprobe $ffprobe --output $root
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $run = Get-ChildItem -LiteralPath $root -Directory | Select-Object -First 1
          $r = Get-Content -LiteralPath (Join-Path $run.FullName 'report.json') -Raw | ConvertFrom-Json
          if ($r.schema_version -ne 1 -or $r.matrix_version -ne 'synthetic-sdr-v1' -or $r.failures -ne 0 -or $r.cancelled) { throw 'Invalid report' }
          if ($r.fixtures.Count -ne 2 -or $r.records.Count -ne 16) { throw 'Incomplete smoke matrix' }
          $ok = @($r.records | Where-Object status -eq 'ok')
          if (@($ok | Where-Object { $_.encoder -eq 'libx264' -and $_.bit_depth -eq 8 }).Count -ne 2) { throw 'x264 positive evidence missing' }
          if (@($ok | Where-Object { $_.bit_depth -eq 10 }).Count -lt 1) { throw '10-bit positive evidence missing' }
          foreach ($c in $ok) {
            if ($c.encoded_frames -ne 12 -or $c.fps -le 0 -or $c.output_bytes -le 0 -or $c.actual_container_bitrate_bps -le 0 -or $null -eq $c.ssim -or $null -eq $c.psnr_db -or $c.output_sha256.Length -ne 64) { throw "Missing evidence: $($c.case_id)" }
          }
          if (Test-Path -LiteralPath (Join-Path $run.FullName 'work')) { throw 'Temporary files were not cleaned' }
          if (@(Get-ChildItem -LiteralPath (Join-Path $run.FullName 'cases') -File).Count -ne 16) { throw 'Missing per-case records' }
          foreach ($f in $r.fixtures) {
            if ($f.file_sha256.Length -ne 64 -or $f.decoded_sha256.Length -ne 64 -or $f.decode_baseline_fps -le 0) { throw "Invalid reference evidence" }
          }
          if ($IsWindows -and ($null -eq $r.environment.system_snapshot.version -or $null -eq $r.environment.system_snapshot.memory)) { throw 'Missing Windows environment' }
          # A second independently generated source must match the first decoded hash.
          $root2 = Join-Path (Get-Location) 'S02 repeat'
          & $exe --smoke --repeats 1 --ffmpeg $ffmpeg --ffprobe $ffprobe --output $root2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $run2 = Get-ChildItem -LiteralPath $root2 -Directory | Select-Object -First 1
          $r2 = Get-Content -LiteralPath (Join-Path $run2.FullName 'report.json') -Raw | ConvertFrom-Json
          foreach ($f in $r.fixtures) {
            $second = @($r2.fixtures | Where-Object id -eq $f.id)
            if ($second.Count -ne 1 -or $second[0].decoded_sha256 -ne $f.decoded_sha256) { throw "Non-repeatable decoded fixture: $($f.id)" }
          }
          New-Item -ItemType Directory -Force dist-s02 | Out-Null
          Copy-Item -LiteralPath (Join-Path $run.FullName 'report.json') -Destination dist-s02/ci-smoke-report.json
      - name: Safe cancellation and cleanup
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { './target/release/orca-benchmark.exe' } else { './target/release/orca-benchmark' }
          $ffmpeg = (Get-Command ffmpeg -CommandType Application | Select-Object -First 1).Source
          $ffprobe = (Get-Command ffprobe -CommandType Application | Select-Object -First 1).Source
          $root = Join-Path (Get-Location) 'S02 cancel & ^ % !'
          $psi = [System.Diagnostics.ProcessStartInfo]::new((Resolve-Path $exe).Path)
          $psi.UseShellExecute = $false
          foreach ($arg in @('--smoke','--ffmpeg',$ffmpeg,'--ffprobe',$ffprobe,'--output',$root)) { $psi.ArgumentList.Add($arg) }
          $proc = [System.Diagnostics.Process]::Start($psi)
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(120)
            $run = $null
            while (-not $proc.HasExited -and [DateTime]::UtcNow -lt $deadline) {
              if (Test-Path -LiteralPath $root) {
                $run = Get-ChildItem -LiteralPath $root -Directory | Select-Object -First 1
                if ($run -and (Test-Path -LiteralPath (Join-Path $run.FullName 'environment.json'))) { break }
              }
              Start-Sleep -Milliseconds 50
            }
            if (-not $run -or $proc.HasExited -or -not (Test-Path -LiteralPath (Join-Path $run.FullName 'environment.json'))) { throw 'Benchmark never reached active workload' }
            [System.IO.File]::WriteAllBytes((Join-Path $run.FullName 'cancel.flag'), [byte[]]@())
            if (-not $proc.WaitForExit(60000)) { throw 'Cancellation timeout' }
            if ($proc.ExitCode -eq 0) { throw 'Cancelled run returned success' }
            if (Test-Path -LiteralPath (Join-Path $run.FullName 'work')) { throw 'Cancelled work directory not removed' }
            if (-not (Test-Path -LiteralPath (Join-Path $run.FullName 'environment.json'))) { throw 'Cancellation lost evidence' }
          } finally {
            if (-not $proc.HasExited) { $proc.Kill($true); $proc.WaitForExit() }
            $proc.Dispose()
          }
      - name: Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target/release/orca-benchmark.exe dist-s02/
          Copy-Item Cargo.lock dist-s02/
          git rev-parse HEAD | Out-File dist-s02/source-sha.txt
          rustc -Vv | Out-File dist-s02/rustc.txt
          Get-FileHash dist-s02/orca-benchmark.exe -Algorithm SHA256 | Format-List | Out-File dist-s02/sha256.txt
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $dumpbin) { throw 'dumpbin not found' }
          & $dumpbin.FullName /dependents dist-s02/orca-benchmark.exe | Out-File dist-s02/pe-imports.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Windows'
        with:
          name: dotOrcA-S02
          path: dist-s02/
          if-no-files-found: error

  prediction:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build and validate standalone predictor
        shell: pwsh
        run: |
          if ($IsWindows) { $env:RUSTFLAGS = '-C target-feature=+crt-static' }
          cargo build --locked --release -p orca-core --bin orca-predict
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = if ($IsWindows) { './target/release/orca-predict.exe' } else { './target/release/orca-predict' }
          $info = & $exe --info | ConvertFrom-Json
          if ($LASTEXITCODE -or $info.official_samples -ne 264 -or $info.official_datasets -ne 2 -or $info.local_samples -ne 0) { throw 'Invalid official dataset' }
          $bad = Join-Path (Get-Location) 'S03 local & (黑洞) ^ % !.json'
          [IO.File]::WriteAllText($bad,'[{"schema_version":999}]')
          & $exe --info --local $bad
          if ($LASTEXITCODE -eq 0) { throw 'Invalid local dataset accepted' }
          $global:LASTEXITCODE = 0
          Remove-Item -LiteralPath $bad
          New-Item -ItemType Directory -Force dist-s03 | Out-Null
          $info | ConvertTo-Json -Depth 20 | Out-File dist-s03/info.json
          $holdout = & $exe --holdout | ConvertFrom-Json
          if ($LASTEXITCODE -or $holdout.groups.Count -ne 6 -or ($holdout.groups | Measure-Object -Property predicted -Sum).Sum -ne 144 -or $holdout.confidence_calibrated) { throw 'Invalid holdout diagnostics' }
          $holdout | ConvertTo-Json -Depth 20 | Out-File dist-s03/holdout.json
      - name: Short source validation (synthetic CI fixture, never training data)
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            if ($IsWindows) { choco install ffmpeg --version=9.1.0 -y --no-progress; if ($LASTEXITCODE) { exit $LASTEXITCODE }; $env:Path += ';C:\ProgramData\chocolatey\bin' }
            else { sudo apt-get update; sudo apt-get install -y ffmpeg; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
          }
          $ffmpeg = (Get-Command ffmpeg -CommandType Application | Select-Object -First 1).Source
          $ffprobe = (Get-Command ffprobe -CommandType Application | Select-Object -First 1).Source
          $source = Join-Path (Get-Location) '小K 的鹅腿坟场 & (黑洞) ^ % !.avi'
          & $ffmpeg -hide_banner -v error -n -f lavfi -i 'testsrc2=size=320x180:rate=24000/1001' -t 32 -c:v libx264 -pix_fmt yuv420p -color_trc bt709 -color_primaries bt709 -colorspace bt709 -bsf:v 'h264_metadata=colour_primaries=1:transfer_characteristics=1:matrix_coefficients=1' -f matroska $source
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = if ($IsWindows) { './target/release/orca-predict.exe' } else { './target/release/orca-predict' }
          $tags = & $ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt,bits_per_raw_sample,color_transfer,color_primaries,color_space -of json $source | ConvertFrom-Json
          if ($LASTEXITCODE -or $tags.streams[0].color_transfer -ne 'bt709' -or $tags.streams[0].color_primaries -ne 'bt709' -or $tags.streams[0].pix_fmt -ne 'yuv420p') { throw 'Fixture VUI not explicitly SDR' }
          $r = & $exe --validate $source --ffmpeg $ffmpeg --ffprobe $ffprobe | ConvertFrom-Json
          if ($LASTEXITCODE -or $r.results[0].status -ne 'ok' -or $r.results[0].samples.Count -ne 2 -or $r.results[0].holdout.encoded_frames -le 0 -or $null -ne $r.results[0].prediction.production_seconds) { throw 'Missing validation evidence' }
          if ($IsWindows -and $null -eq $r.results[0].samples[0].pretest_system_cpu_busy_pct) { throw 'Missing pretest CPU occupancy' }
          $r | ConvertTo-Json -Depth 20 | Out-File dist-s03/sample-validation.json
          $untagged = Join-Path (Get-Location) 'untagged SDR 小K & (黑洞) ^ % !.mp4'
          & $ffmpeg -hide_banner -v error -n -i $source -map 0:v:0 -c:v copy -bsf:v 'h264_metadata=colour_primaries=2:transfer_characteristics=2:matrix_coefficients=1' -color_trc unspecified -color_primaries unspecified -colorspace bt709 $untagged
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $tags2 = & $ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt,color_transfer,color_space -of json $untagged | ConvertFrom-Json
          if ($LASTEXITCODE -or $tags2.streams[0].pix_fmt -ne 'yuv420p' -or $tags2.streams[0].color_space -ne 'bt709' -or ($tags2.streams[0].color_transfer -notin @($null,'unknown','unspecified'))) { throw 'Untagged fixture metadata mismatch' }
          $env:DOTORCA_TEST_FFMPEG = $ffmpeg
          $env:DOTORCA_TEST_SOURCE = $untagged
          cargo test --locked -p orca-core predict::sample::tests::strict_nv12_conversion -- --ignored --exact
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $exe --validate $untagged --ffmpeg $ffmpeg --ffprobe $ffprobe
          if ($LASTEXITCODE -eq 0) { throw 'Untagged source accepted without explicit consent' }
          $global:LASTEXITCODE = 0
          $u = & $exe --validate $untagged --assume-sdr --ffmpeg $ffmpeg --ffprobe $ffprobe | ConvertFrom-Json
          if ($LASTEXITCODE -or $u.source.hdr_classification -ne 'Unknown' -or $u.source.color_basis -ne 'user_confirmed_untagged_sdr' -or $u.results[0].status -ne 'ok') { throw 'Explicitly confirmed SDR regression failed' }
          $u | ConvertTo-Json -Depth 20 | Out-File dist-s03/untagged-validation.json
          Remove-Item -LiteralPath $source,$untagged
      - name: Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target/release/orca-predict.exe dist-s03/
          Copy-Item Cargo.lock dist-s03/
          Copy-Item data/official/*.json dist-s03/
          git rev-parse HEAD | Out-File dist-s03/source-sha.txt
          rustc -Vv | Out-File dist-s03/rustc.txt
          Get-FileHash dist-s03/orca-predict.exe -Algorithm SHA256 | Format-List | Out-File dist-s03/sha256.txt
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $dumpbin) { throw 'dumpbin not found' }
          & $dumpbin.FullName /dependents dist-s03/orca-predict.exe | Out-File dist-s03/pe-imports.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Windows'
        with:
          name: dotOrcA-S03
          path: dist-s03/
          if-no-files-found: error

  pipeline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run actual encoding and transactional validation
        shell: pwsh
        run: |
          if ($IsWindows) {
            choco install ffmpeg-full --version=9.1.0 -y --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $package = Join-Path $env:ChocolateyInstall 'lib\ffmpeg-full\tools'
            $bin = (Get-ChildItem -LiteralPath $package -Recurse -File -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
            if (-not $bin) { throw 'FFmpeg full executable missing' }
            $env:DOTORCA_TEST_FFMPEG = Join-Path $bin 'ffmpeg.exe'
            $env:DOTORCA_TEST_FFPROBE = Join-Path $bin 'ffprobe.exe'
            $env:RUSTFLAGS = '-C target-feature=+crt-static'
          } else {
            if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
              sudo apt-get update
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
              sudo apt-get install -y ffmpeg
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
            }
            $env:DOTORCA_TEST_FFMPEG = (Get-Command ffmpeg -CommandType Application | Select-Object -First 1).Source
            $env:DOTORCA_TEST_FFPROBE = (Get-Command ffprobe -CommandType Application | Select-Object -First 1).Source
          }
          if ($IsWindows) {
            $vhd = Join-Path $env:RUNNER_TEMP 'dotorca-full-test.vhd'
            $script = Join-Path $env:RUNNER_TEMP 'dotorca-vhd.txt'
            try {
              @(
                "create vdisk file=`"$vhd`" maximum=32 type=fixed"
                "select vdisk file=`"$vhd`""
                'attach vdisk'
                'create partition primary'
                'format fs=ntfs quick label=DotOrcAFill'
                'assign'
              ) | Set-Content -LiteralPath $script -Encoding ascii
              & diskpart.exe /s $script
              if ($LASTEXITCODE) { throw "DiskPart setup failed ($LASTEXITCODE)" }
              $volume = Get-Volume -FileSystemLabel 'DotOrcAFill'
              if (-not $volume.DriveLetter) { throw 'Test volume has no drive letter' }
              $testRoot = Join-Path "$($volume.DriveLetter):\" 'dotOrcA-test'
              New-Item -ItemType Directory -Path $testRoot -ErrorAction Stop | Out-Null
              $env:DOTORCA_TEST_FULL_ROOT = $testRoot
              cargo test --locked -p orca-core production_special_path -- --ignored --nocapture
              if ($LASTEXITCODE) { throw "Pipeline regression failed ($LASTEXITCODE)" }
            } finally {
              if (Test-Path -LiteralPath $vhd) {
                @("select vdisk file=`"$vhd`"", 'detach vdisk') |
                  Set-Content -LiteralPath $script -Encoding ascii
                & diskpart.exe /s $script
                if ($LASTEXITCODE) { throw "DiskPart detach failed ($LASTEXITCODE)" }
                Remove-Item -LiteralPath $vhd -ErrorAction Stop
              }
              Remove-Item -LiteralPath $script -ErrorAction SilentlyContinue
            }
          } else {
            cargo test --locked -p orca-core production_special_path -- --ignored --nocapture
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v')
    needs: [pure-rust, gui, core, benchmark, prediction, pipeline]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Publish verified Windows package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --name dotOrcA-windows-x64 --dir dist
          version="$(tr -d '\r\n' < dist/version.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          test "$(tr -d '\r\n' < dist/source-sha.txt)" = "$GITHUB_SHA"
          test "$(git log -1 --format=%s)" = "Release $tag"
          test -s dist/dotorca.exe
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing overwrite" >&2
            exit 1
          fi
          if [[ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]]; then
            echo "Tag $tag already exists; refusing overwrite" >&2
            exit 1
          fi
          # The validation CLI is a CI tool, not required for the portable app.
          rm -f dist/orca-verify.exe
          asset="dotOrcA-$tag-win-x64.zip"
          (cd dist && zip -q -r "../$asset" .)
          sha256sum "$asset" > "$asset.sha256"
          gh release create "$tag" "$asset" "$asset.sha256" --target "$GITHUB_SHA" --title "dotOrcA $tag" --notes-file docs/RELEASE-NOTES.md
